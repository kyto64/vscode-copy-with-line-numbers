name: Check rulesync

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    paths:
      - ".rulesync/**"
      - "rulesync.jsonc"
      - "CLAUDE.md"
      - "AGENTS.md"
      - ".claude/rules/**"
      - ".claude/skills/**"
      - ".claude/settings.json"
      - ".agents/skills/**"
      - ".mcp.json"
      - ".codex/memories/**"
      - ".cursor/rules/**"
      - ".github/dependabot.yml"
      - ".github/workflows/check_rulesync.yaml"

env:
  RULESYNC_VERSION: "8.17.0"

permissions:
  contents: read

jobs:
  check-rulesync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install rulesync
        run: npm install -g "rulesync@${RULESYNC_VERSION}"

      - name: Check generated AI settings
        run: |
          rulesync generate --check || {
            echo "::error::AI settings out of sync. Edit .rulesync/, run rulesync generate, commit."
            exit 1
          }
