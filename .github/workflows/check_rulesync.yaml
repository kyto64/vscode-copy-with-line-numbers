name: Check rulesync

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

env:
  RULESYNC_VERSION: "33.0.0"

permissions:
  contents: read

jobs:
  check-rulesync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install rulesync
        run: npm install -g "rulesync@${RULESYNC_VERSION}"

      - name: Validate rulesync SSOT (AGENTS.md and .agents/skills/)
        run: |
          rulesync generate
          git add --intent-to-add -- AGENTS.md .agents/
          if ! git diff --exit-code -- AGENTS.md .agents/; then
            echo "::error::rulesync outputs out of sync. Edit .rulesync/, run npm run rules:generate, commit AGENTS.md and .agents/skills/."
            exit 1
          fi
