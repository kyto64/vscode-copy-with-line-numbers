initialize:
  - name: Install Node.js 24
    uses: github.com/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
    with:
      node-version: "24"

  - name: Install xvfb and VS Code test libraries
    run: |
      sudo apt-get update
      # Ubuntu 24.04 renamed libasound2 to libasound2t64; fall back to libasound2 on 22.04.
      if apt-cache show libasound2t64 >/dev/null 2>&1; then ASOUND=libasound2t64; else ASOUND=libasound2; fi
      sudo apt-get install -y xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 libgtk-3-0 libgbm1 "$ASOUND" libxss1

maintenance: |
  npm ci

knowledge:
  - name: lint
    contents: npm run lint
  - name: build
    contents: npm run compile
  - name: test
    contents: xvfb-run -a npm test
