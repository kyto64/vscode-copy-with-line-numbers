initialize:
  - name: Install Node.js 24
    uses: github.com/actions/setup-node@v4
    with:
      node-version: "24"

  - name: Install xvfb and VS Code test libraries
    run: |
      sudo apt-get update
      sudo apt-get install -y xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2 libxss1

maintenance: |
  npm ci

knowledge:
  - name: lint
    contents: npm run lint
  - name: build
    contents: npm run compile
  - name: test
    contents: xvfb-run -a npm test
